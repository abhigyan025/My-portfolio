<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Kumar Abhigyan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#0E0E10; --paper:#F4F1EA; --gold:#C9A35C; --slate:#9a9080; --line:rgba(244,241,234,.14); }
  *{box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;margin:0;padding:24px;max-width:720px;margin:0 auto;}
  h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:600;}
  h2{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:600;margin:0 0 4px;}
  .tabs{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;}
  .tab{padding:9px 16px;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:none;color:var(--paper);font-size:.9rem;}
  .tab.active{border-color:var(--gold);color:var(--gold);}
  .panel-section{display:none;flex-direction:column;gap:14px;}
  .panel-section.active{display:flex;}
  form{display:flex;flex-direction:column;gap:14px;margin-bottom:32px;padding-bottom:28px;border-bottom:1px solid var(--line);}
  label{font-size:.85rem;color:var(--slate);}
  input,textarea{background:#1a1a1d;border:1px solid var(--line);color:var(--paper);padding:10px;border-radius:3px;font-family:inherit;font-size:.95rem;width:100%;}
  textarea{min-height:120px;resize:vertical;}
  button{cursor:pointer;font-family:inherit;}
  button[type=submit]{padding:12px;background:var(--gold);color:var(--ink);border:none;border-radius:3px;font-weight:500;margin-top:6px;}
  #status{margin-top:16px;font-size:.9rem;min-height:1.2em;}
  #lock{max-width:340px;display:flex;flex-direction:column;gap:14px;margin-top:60px;}
  #lockStatus{font-size:.85rem;min-height:1.2em;}
  .hidden{display:none;}
  .item{border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px;}
  .item.is-hidden{opacity:.45;}
  .item-meta{color:var(--slate);font-size:.82rem;margin-bottom:10px;}
  .item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .item-actions button{padding:7px 12px;border-radius:3px;border:1px solid var(--line);background:none;color:var(--paper);font-size:.8rem;}
  .item-actions button:hover{border-color:var(--gold);color:var(--gold);}
  .item-actions button.danger:hover{border-color:#e07856;color:#e07856;}
  .list-loading{color:var(--slate);font-size:.85rem;}
  .edit-form{display:none;flex-direction:column;gap:10px;margin-top:12px;}
  .edit-form.active{display:flex;}
  .section-heading{color:var(--gold);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin:28px 0 12px;}
</style>
</head>
<body>

<div id="lock">
  <h1>Admin Access</h1>
  <p style="color:var(--slate);font-size:.9rem">This page is private. Enter your passphrase to continue.</p>
  <input type="password" id="pass" placeholder="Passphrase">
  <button type="button" id="unlockBtn" style="padding:12px;background:var(--gold);color:var(--ink);border:none;border-radius:3px;">Unlock</button>
  <p id="lockStatus"></p>
</div>

<div id="panel" class="hidden">
  <h1>Admin Panel</h1>
  <div class="tabs">
    <button class="tab active" data-tab="book">Books</button>
    <button class="tab" data-tab="essay">Essays</button>
    <button class="tab" data-tab="update">Updates</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <!-- BOOKS -->
  <div class="panel-section active" id="bookSection">
    <p class="section-heading">Add Book</p>
    <form id="bookForm">
      <label>Title</label>
      <input name="title" required>
      <label>Tagline / short description</label>
      <input name="tagline">
      <label>Cover image URL (upload to imgbb.com etc, paste link here)</label>
      <input name="coverUrl" placeholder="https://...">
      <label>Buy link (optional)</label>
      <input name="buyLink">
      <label>Demo/read link (optional)</label>
      <input name="demoLink">
      <label><input type="checkbox" name="comingSoon" style="width:auto"> Mark as "Coming Soon"</label>
      <button type="submit">Publish Book</button>
    </form>
    <p class="section-heading">Existing Books (Sanity-managed only)</p>
    <div id="bookList" class="list-loading">Loading...</div>
  </div>

  <!-- ESSAYS -->
  <div class="panel-section" id="essaySection">
    <p class="section-heading">Add Essay</p>
    <form id="essayForm">
      <label>Title</label>
      <input name="title" required>
      <label>Short excerpt (shown on the card)</label>
      <input name="excerpt">
      <label>Full essay text (one paragraph per line)</label>
      <textarea name="body" required></textarea>
      <button type="submit">Publish Essay</button>
    </form>
    <p class="section-heading">Existing Essays (Sanity-managed only)</p>
    <div id="essayList" class="list-loading">Loading...</div>
  </div>

  <!-- UPDATES -->
  <div class="panel-section" id="updateSection">
    <p class="section-heading">Add Update</p>
    <form id="updateForm">
      <label>Date</label>
      <input type="date" name="date" required>
      <label>Update text</label>
      <input name="text" required placeholder="e.g. Started writing book three">
      <button type="submit">Publish Update</button>
    </form>
    <p class="section-heading">Existing Updates</p>
    <div id="updateList" class="list-loading">Loading...</div>
  </div>

  <!-- SETTINGS -->
  <div class="panel-section" id="settingsSection">
    <p class="section-heading">Site Settings</p>
    <form id="settingsForm">
      <label>Footer quote</label>
      <input name="footerQuote" placeholder="We suffer more in imagination than reality">
      <label>Instagram followers (shown as-is, e.g. "9,000+")</label>
      <input name="followers" placeholder="9,000+">
      <label>Sales last month (shown as-is, e.g. "500+")</label>
      <input name="salesLastMonth" placeholder="500+">
      <button type="submit">Save Settings</button>
    </form>
  </div>

  <div id="status"></div>
</div>

<script>
/* ====== CONFIG ====== */
const SANITY_PROJECT_ID = "zsm7toak";
const SANITY_DATASET = "production";
const SANITY_API = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}`;
const SETTINGS_ID = "siteSettings";

let sessionPass = null; // held in memory only, never saved to disk/repo

const statusEl = () => document.getElementById("status");
function setStatus(msg, ok){
  const el = statusEl();
  el.textContent = msg;
  el.style.color = ok ? "#7fb069" : "#e07856";
}

/* ====== UNLOCK (server-checked) ====== */
document.getElementById("unlockBtn").addEventListener("click", async () => {
  const lockStatus = document.getElementById("lockStatus");
  const typed = document.getElementById("pass").value;
  lockStatus.textContent = "Checking...";
  lockStatus.style.color = "var(--slate)";
  try{
    const res = await fetch("/api/verify", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ pass: typed })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      sessionPass = typed;
      document.getElementById("lock").classList.add("hidden");
      document.getElementById("panel").classList.remove("hidden");
      loadAll();
    }else{
      lockStatus.textContent = "Incorrect passphrase.";
      lockStatus.style.color = "#e07856";
    }
  }catch(err){
    lockStatus.textContent = "Something went wrong. Try again.";
    lockStatus.style.color = "#e07856";
  }
});

/* ====== TABS ====== */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel-section").forEach(s => s.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab + "Section").classList.add("active");
  });
});

/* ====== SANITY READ (public, no passphrase needed) ====== */
async function sanityFetch(query){
  try{
    const res = await fetch(`${SANITY_API}?query=${encodeURIComponent(query)}`);
    const json = await res.json();
    return json.result || [];
  }catch(e){ console.warn("Sanity fetch failed", e); return []; }
}

/* ====== SERVERLESS CALLS (passphrase sent along, checked server-side) ====== */
async function apiPublish(doc){
  const res = await fetch("/api/publish", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ doc, pass: sessionPass })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(JSON.stringify(data.error || data));
  return data;
}

async function apiMutate(body){
  const res = await fetch("/api/mutate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ ...body, pass: sessionPass })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(JSON.stringify(data.error || data));
  return data;
}

/* ====== ADD FORMS ====== */
document.getElementById("bookForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  setStatus("Publishing...", true);
  try{
    await apiPublish({
      _type: "book",
      title: f.get("title"),
      tagline: f.get("tagline"),
      coverUrl: f.get("coverUrl"),
      buyLink: f.get("buyLink"),
      demoLink: f.get("demoLink"),
      comingSoon: f.get("comingSoon") === "on",
      hidden: false
    });
    setStatus("✅ Book published.", true);
    e.target.reset();
    loadBooks();
  }catch(err){ setStatus("❌ " + err.message, false); }
});

document.getElementById("essayForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  setStatus("Publishing...", true);
  try{
    await apiPublish({
      _type: "essay",
      title: f.get("title"),
      excerpt: f.get("excerpt"),
      body: f.get("body"),
      hidden: false
    });
    setStatus("✅ Essay published.", true);
    e.target.reset();
    loadEssays();
  }catch(err){ setStatus("❌ " + err.message, false); }
});

document.getElementById("updateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  setStatus("Publishing...", true);
  try{
    await apiPublish({
      _type: "update",
      date: f.get("date"),
      text: f.get("text"),
      hidden: false
    });
    setStatus("✅ Update published.", true);
    e.target.reset();
    loadUpdates();
  }catch(err){ setStatus("❌ " + err.message, false); }
});

document.getElementById("settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  setStatus("Saving...", true);
  try{
    await apiMutate({
      action: "upsertSettings",
      doc: {
        _id: SETTINGS_ID,
        _type: "siteSettings",
        footerQuote: f.get("footerQuote"),
        followers: f.get("followers"),
        salesLastMonth: f.get("salesLastMonth")
      }
    });
    setStatus("✅ Settings saved.", true);
  }catch(err){ setStatus("❌ " + err.message, false); }
});

/* ====== LOAD + RENDER LISTS ====== */
function itemActionsHtml(id, hidden){
  return `
    <div class="item-actions">
      <button type="button" class="editBtn" data-id="${id}">Edit</button>
      <button type="button" class="hideBtn" data-id="${id}" data-hidden="${hidden}">${hidden ? "Unhide" : "Hide"}</button>
      <button type="button" class="danger deleteBtn" data-id="${id}">Delete</button>
    </div>`;
}

async function loadBooks(){
  const list = document.getElementById("bookList");
  list.innerHTML = "Loading...";
  const books = await sanityFetch(`*[_type=="book"]|order(_createdAt desc)`);
  if(!books.length){ list.innerHTML = `<p class="list-loading">No Sanity books yet.</p>`; return; }
  list.innerHTML = books.map(b => `
    <div class="item ${b.hidden ? 'is-hidden' : ''}" data-id="${b._id}">
      <h2>${b.title || "Untitled"}</h2>
      <div class="item-meta">${b.tagline || ""} ${b.comingSoon ? "· Coming Soon" : ""} ${b.hidden ? "· HIDDEN" : ""}</div>
      ${itemActionsHtml(b._id, !!b.hidden)}
      <div class="edit-form" data-editid="${b._id}">
        <label>Title</label><input class="ef-title" value="${(b.title||"").replace(/"/g,'&quot;')}">
        <label>Tagline</label><input class="ef-tagline" value="${(b.tagline||"").replace(/"/g,'&quot;')}">
        <label>Cover URL</label><input class="ef-coverUrl" value="${(b.coverUrl||"").replace(/"/g,'&quot;')}">
        <label>Buy link</label><input class="ef-buyLink" value="${(b.buyLink||"").replace(/"/g,'&quot;')}">
        <label>Demo link</label><input class="ef-demoLink" value="${(b.demoLink||"").replace(/"/g,'&quot;')}">
        <button type="button" class="saveEditBtn" data-id="${b._id}" data-type="book">Save Changes</button>
      </div>
    </div>`).join("");
  wireItemButtons("book");
}

async function loadEssays(){
  const list = document.getElementById("essayList");
  list.innerHTML = "Loading...";
  const essays = await sanityFetch(`*[_type=="essay"]|order(_createdAt desc)`);
  if(!essays.length){ list.innerHTML = `<p class="list-loading">No Sanity essays yet.</p>`; return; }
  list.innerHTML = essays.map(es => `
    <div class="item ${es.hidden ? 'is-hidden' : ''}" data-id="${es._id}">
      <h2>${es.title || "Untitled"}</h2>
      <div class="item-meta">${es.excerpt || ""} ${es.hidden ? "· HIDDEN" : ""}</div>
      ${itemActionsHtml(es._id, !!es.hidden)}
      <div class="edit-form" data-editid="${es._id}">
        <label>Title</label><input class="ef-title" value="${(es.title||"").replace(/"/g,'&quot;')}">
        <label>Excerpt</label><input class="ef-excerpt" value="${(es.excerpt||"").replace(/"/g,'&quot;')}">
        <label>Body</label><textarea class="ef-body">${es.body||""}</textarea>
        <button type="button" class="saveEditBtn" data-id="${es._id}" data-type="essay">Save Changes</button>
      </div>
    </div>`).join("");
  wireItemButtons("essay");
}

async function loadUpdates(){
  const list = document.getElementById("updateList");
  list.innerHTML = "Loading...";
  const updates = await sanityFetch(`*[_type=="update"]|order(date desc)`);
  if(!updates.length){ list.innerHTML = `<p class="list-loading">No updates yet.</p>`; return; }
  list.innerHTML = updates.map(u => `
    <div class="item ${u.hidden ? 'is-hidden' : ''}" data-id="${u._id}">
      <h2>${u.date || ""}</h2>
      <div class="item-meta">${u.text || ""} ${u.hidden ? "· HIDDEN" : ""}</div>
      ${itemActionsHtml(u._id, !!u.hidden)}
      <div class="edit-form" data-editid="${u._id}">
        <label>Date</label><input type="date" class="ef-date" value="${u.date||""}">
        <label>Text</label><input class="ef-text" value="${(u.text||"").replace(/"/g,'&quot;')}">
        <button type="button" class="saveEditBtn" data-id="${u._id}" data-type="update">Save Changes</button>
      </div>
    </div>`).join("");
  wireItemButtons("update");
}

async function loadSettings(){
  const docs = await sanityFetch(`*[_id=="${SETTINGS_ID}"]`);
  const s = docs[0] || {};
  document.querySelector('#settingsForm [name="footerQuote"]').value = s.footerQuote || "";
  document.querySelector('#settingsForm [name="followers"]').value = s.followers || "";
  document.querySelector('#settingsForm [name="salesLastMonth"]').value = s.salesLastMonth || "";
}

function wireItemButtons(type){
  document.querySelectorAll(".editBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const ef = document.querySelector(`.edit-form[data-editid="${btn.dataset.id}"]`);
      if(ef) ef.classList.toggle("active");
    });
  });

  document.querySelectorAll(".hideBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const willHide = btn.dataset.hidden !== "true";
      setStatus("Updating...", true);
      try{
        await apiMutate({ action:"patch", id: btn.dataset.id, fields: { hidden: willHide } });
        setStatus("✅ Updated.", true);
        reloadList(type);
      }catch(err){ setStatus("❌ " + err.message, false); }
    });
  });

  document.querySelectorAll(".deleteBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!confirm("Delete this permanently? This cannot be undone.")) return;
      setStatus("Deleting...", true);
      try{
        await apiMutate({ action:"delete", id: btn.dataset.id });
        setStatus("✅ Deleted.", true);
        reloadList(type);
      }catch(err){ setStatus("❌ " + err.message, false); }
    });
  });

  document.querySelectorAll(".saveEditBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const t = btn.dataset.type;
      const ef = document.querySelector(`.edit-form[data-editid="${id}"]`);
      let fields = {};
      if(t === "book"){
        fields = {
          title: ef.querySelector(".ef-title").value,
          tagline: ef.querySelector(".ef-tagline").value,
          coverUrl: ef.querySelector(".ef-coverUrl").value,
          buyLink: ef.querySelector(".ef-buyLink").value,
          demoLink: ef.querySelector(".ef-demoLink").value
        };
      } else if(t === "essay"){
        fields = {
          title: ef.querySelector(".ef-title").value,
          excerpt: ef.querySelector(".ef-excerpt").value,
          body: ef.querySelector(".ef-body").value
        };
      } else if(t === "update"){
        fields = {
          date: ef.querySelector(".ef-date").value,
          text: ef.querySelector(".ef-text").value
        };
      }
      setStatus("Saving...", true);
      try{
        await apiMutate({ action:"patch", id, fields });
        setStatus("✅ Saved.", true);
        reloadList(t);
      }catch(err){ setStatus("❌ " + err.message, false); }
    });
  });
}

function reloadList(type){
  if(type === "book") loadBooks();
  if(type === "essay") loadEssays();
  if(type === "update") loadUpdates();
}

function loadAll(){
  loadBooks();
  loadEssays();
  loadUpdates();
  loadSettings();
}
</script>
</body>
</html>
